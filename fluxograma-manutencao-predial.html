<!DOCTYPE html>
<html lang="pt-BR">
<head>
<!-- skill:chrome -->
<style>
/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }
  .design-ui-credit { display: none !important; }
}

</style>
<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>
<!-- /skill:chrome -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxograma: Gestão de Chamados de Manutenção Predial</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: oklch(97% 0.005 220);
    --text-primary: oklch(18% 0.01 220);
    --text-secondary: oklch(42% 0.01 220);
    --text-on-dark: oklch(96% 0.005 220);

    --start-bg: oklch(52% 0.14 155);
    --start-stroke: oklch(42% 0.12 155);

    --end-bg: oklch(40% 0.1 260);
    --end-stroke: oklch(30% 0.08 260);

    --input-bg: oklch(92% 0.04 250);
    --input-stroke: oklch(62% 0.1 250);
    --input-header: oklch(50% 0.12 250);

    --decision-bg: oklch(93% 0.05 75);
    --decision-stroke: oklch(62% 0.14 75);
    --decision-text: oklch(32% 0.08 75);

    --process-bg: oklch(95% 0.02 220);
    --process-stroke: oklch(60% 0.06 220);
    --process-header: oklch(45% 0.06 220);

    --error-bg: oklch(92% 0.06 25);
    --error-stroke: oklch(58% 0.16 25);
    --error-text: oklch(38% 0.12 25);

    --alert-bg: oklch(48% 0.18 25);
    --alert-stroke: oklch(38% 0.15 25);

    --success-bg: oklch(92% 0.04 155);
    --success-stroke: oklch(55% 0.12 155);
    --success-text: oklch(35% 0.1 155);

    --arrow: oklch(50% 0.02 220);
    --label-yes: oklch(42% 0.12 155);
    --label-no: oklch(48% 0.16 25);

    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 64px;
  }

  .page-header {
    text-align: center;
    margin-bottom: 48px;
    max-width: 640px;
  }

  .page-header .eyebrow {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--start-bg);
    margin-bottom: 12px;
  }

  .page-header h1 {
    font-size: clamp(1.5rem, 3vw, 2rem);
    font-weight: 700;
    line-height: 1.25;
    color: var(--text-primary);
    text-wrap: balance;
  }

  .page-header p {
    margin-top: 12px;
    font-size: 0.9375rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  .flowchart-container {
    width: 100%;
    max-width: 900px;
    overflow-x: auto;
    display: flex;
    justify-content: center;
  }

  svg.flowchart {
    width: 100%;
    height: auto;
    max-width: 860px;
  }

  /* Animations */
  .flow-node {
    opacity: 0;
    animation: fadeInUp 0.5s var(--ease-out-quart) forwards;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .flow-node:nth-child(1)  { animation-delay: 0.05s; }
  .flow-node:nth-child(2)  { animation-delay: 0.1s; }
  .flow-node:nth-child(3)  { animation-delay: 0.15s; }
  .flow-node:nth-child(4)  { animation-delay: 0.2s; }
  .flow-node:nth-child(5)  { animation-delay: 0.25s; }
  .flow-node:nth-child(6)  { animation-delay: 0.3s; }
  .flow-node:nth-child(7)  { animation-delay: 0.35s; }
  .flow-node:nth-child(8)  { animation-delay: 0.4s; }
  .flow-node:nth-child(9)  { animation-delay: 0.45s; }
  .flow-node:nth-child(10) { animation-delay: 0.5s; }
  .flow-node:nth-child(11) { animation-delay: 0.55s; }

  .flow-arrow {
    opacity: 0;
    animation: fadeIn 0.4s var(--ease-out-quart) forwards;
    animation-delay: 0.6s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* Legend */
  .legend {
    margin-top: 40px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px 32px;
    justify-content: center;
    max-width: 860px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.8125rem;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .legend-swatch {
    width: 28px;
    height: 16px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  @media (max-width: 640px) {
    body { padding: 32px 12px 48px; }
    .page-header { margin-bottom: 32px; }
    .legend { gap: 12px 24px; }
  }
</style>
</head>
<body>

<header class="page-header">
  <div class="eyebrow">Sistema Escolar</div>
  <h1>Gestão de Chamados de Manutenção Predial</h1>
  <p>Fluxo completo: da abertura do chamado ao registro, com validação de campos obrigatórios e alerta de sobrecarga.</p>
</header>

<div class="flowchart-container">
<svg class="flowchart" viewBox="0 0 860 1340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="oklch(50% 0.02 220)">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrowhead-no" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="oklch(48% 0.16 25)">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <marker id="arrowhead-yes" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" fill="oklch(42% 0.12 155)">
      <polygon points="0 0, 10 3.5, 0 7" />
    </marker>
    <filter id="shadow-sm" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="oklch(20% 0.01 220)" flood-opacity="0.08"/>
    </filter>
    <filter id="shadow-alert" x="-6%" y="-6%" width="112%" height="118%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="oklch(40% 0.18 25)" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- ========== ARROWS (behind nodes) ========== -->
  <g class="flow-arrow">
    <!-- Start → Input -->
    <line x1="430" y1="62" x2="430" y2="100" stroke="var(--arrow)" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Input → Decision 1 -->
    <line x1="430" y1="256" x2="430" y2="300" stroke="var(--arrow)" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Decision 1 → YES → Process -->
    <line x1="430" y1="396" x2="430" y2="460" stroke="var(--label-yes)" stroke-width="2.5" marker-end="url(#arrowhead-yes)"/>
    <rect x="416" y="418" width="28" height="18" rx="4" fill="var(--success-bg)" stroke="var(--success-stroke)" stroke-width="1"/>
    <text x="430" y="431" text-anchor="middle" font-size="10" font-weight="600" fill="var(--label-yes)" font-family="Inter, system-ui">Sim</text>

    <!-- Decision 1 → NO → Error (to the left) -->
    <polyline points="340,348 220,348 220,420" stroke="var(--label-no)" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-no)"/>
    <rect x="258" y="335" width="30" height="18" rx="4" fill="var(--error-bg)" stroke="var(--error-stroke)" stroke-width="1"/>
    <text x="273" y="348" text-anchor="middle" font-size="10" font-weight="600" fill="var(--label-no)" font-family="Inter, system-ui">Não</text>

    <!-- Error → back to Input (loop left side) -->
    <polyline points="220,488 220,540 100,540 100,178 300,178" stroke="var(--label-no)" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrowhead-no)"/>
    <text x="86" y="370" text-anchor="middle" font-size="9" font-weight="500" fill="var(--label-no)" font-family="Inter, system-ui" transform="rotate(-90, 86, 370)">Retorna ao formulário</text>

    <!-- Process → Decision 2 -->
    <line x1="430" y1="604" x2="430" y2="660" stroke="var(--arrow)" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Decision 2 → YES → Alert (right) -->
    <polyline points="520,730 640,730 640,820" stroke="var(--label-no)" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-no)"/>
    <rect x="540" y="717" width="28" height="18" rx="4" fill="var(--error-bg)" stroke="var(--error-stroke)" stroke-width="1"/>
    <text x="554" y="730" text-anchor="middle" font-size="10" font-weight="600" fill="var(--label-no)" font-family="Inter, system-ui">Sim</text>

    <!-- Decision 2 → NO → List (left) -->
    <polyline points="340,730 220,730 220,820" stroke="var(--label-yes)" stroke-width="2.5" fill="none" marker-end="url(#arrowhead-yes)"/>
    <rect x="258" y="717" width="30" height="18" rx="4" fill="var(--success-bg)" stroke="var(--success-stroke)" stroke-width="1"/>
    <text x="273" y="730" text-anchor="middle" font-size="10" font-weight="600" fill="var(--label-yes)" font-family="Inter, system-ui">Não</text>

    <!-- Alert → End -->
    <polyline points="640,910 640,1000 430,1000 430,1030" stroke="var(--arrow)" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

    <!-- List → End -->
    <polyline points="220,910 220,1000 430,1000 430,1030" stroke="var(--arrow)" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  </g>

  <!-- ========== NODES ========== -->

  <!-- 1. INÍCIO -->
  <g class="flow-node">
    <rect x="355" y="16" width="150" height="46" rx="23" fill="var(--start-bg)" filter="url(#shadow-sm)"/>
    <text x="430" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text-on-dark)" font-family="Inter, system-ui" letter-spacing="0.04em">INÍCIO</text>
  </g>

  <!-- 2. ENTRADA DE DADOS -->
  <g class="flow-node">
    <rect x="300" y="102" width="260" height="152" rx="12" fill="var(--input-bg)" stroke="var(--input-stroke)" stroke-width="2" filter="url(#shadow-sm)"/>
    <rect x="300" y="102" width="260" height="36" rx="12" fill="var(--input-header)"/>
    <rect x="300" y="126" width="260" height="12" fill="var(--input-header)"/>
    <text x="430" y="126" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-on-dark)" font-family="Inter, system-ui" letter-spacing="0.04em">ENTRADA DE DADOS</text>

    <text x="320" y="163" font-size="12" font-weight="500" fill="var(--text-primary)" font-family="Inter, system-ui">📝 Descrição do problema</text>
    <text x="320" y="183" font-size="12" font-weight="500" fill="var(--text-primary)" font-family="Inter, system-ui">📍 Local da ocorrência</text>
    <text x="320" y="203" font-size="12" font-weight="500" fill="var(--text-primary)" font-family="Inter, system-ui">🏷️ Categoria</text>
    <text x="320" y="223" font-size="12" font-weight="500" fill="var(--text-primary)" font-family="Inter, system-ui">⚡ Prioridade (1 a 10)</text>

    <text x="430" y="247" text-anchor="middle" font-size="9.5" font-weight="500" fill="var(--text-secondary)" font-family="Inter, system-ui">Usuário preenche o formulário</text>
  </g>

  <!-- 3. DECISÃO 1: Campos preenchidos? -->
  <g class="flow-node">
    <polygon points="430,302 520,348 430,394 340,348" fill="var(--decision-bg)" stroke="var(--decision-stroke)" stroke-width="2" filter="url(#shadow-sm)"/>
    <text x="430" y="340" text-anchor="middle" font-size="10" font-weight="600" fill="var(--decision-text)" font-family="Inter, system-ui">Campos obrigatórios</text>
    <text x="430" y="354" text-anchor="middle" font-size="10" font-weight="600" fill="var(--decision-text)" font-family="Inter, system-ui">preenchidos?</text>
  </g>

  <!-- 4. ERRO -->
  <g class="flow-node">
    <rect x="150" y="420" width="140" height="68" rx="10" fill="var(--error-bg)" stroke="var(--error-stroke)" stroke-width="2" filter="url(#shadow-sm)"/>
    <text x="220" y="448" text-anchor="middle" font-size="10" font-weight="600" fill="var(--error-text)" font-family="Inter, system-ui" letter-spacing="0.02em">⚠️ MENSAGEM DE ERRO</text>
    <text x="220" y="466" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--error-text)" font-family="Inter, system-ui">"Preencha todos</text>
    <text x="220" y="480" text-anchor="middle" font-size="10.5" font-weight="500" fill="var(--error-text)" font-family="Inter, system-ui">os campos"</text>
  </g>

  <!-- 5. PROCESSAMENTO -->
  <g class="flow-node">
    <rect x="300" y="462" width="260" height="140" rx="12" fill="var(--process-bg)" stroke="var(--process-stroke)" stroke-width="2" filter="url(#shadow-sm)"/>
    <rect x="300" y="462" width="260" height="36" rx="12" fill="var(--process-header)"/>
    <rect x="300" y="486" width="260" height="12" fill="var(--process-header)"/>
    <text x="430" y="486" text-anchor="middle" font-size="11" font-weight="600" fill="var(--text-on-dark)" font-family="Inter, system-ui" letter-spacing="0.04em">PROCESSAMENTO</text>

    <text x="320" y="523" font-size="12" font-weight="500" fill="var(--text-primary)" font-family="Inter, system-ui">💾 Salvar chamado em memória</text>
    <text x="320" y="548" font-size="12" font-weight="500" fill="var(--text-primary)" font-family="Inter, system-ui">📋 Registrar evento no</text>
    <text x="335" y="566" font-size="12" font-weight="500" fill="var(--text-primary)" font-family="Inter, system-ui">Histórico de Operações</text>

    <text x="430" y="593" text-anchor="middle" font-size="9.5" font-weight="500" fill="var(--text-secondary)" font-family="Inter, system-ui">Sistema persiste os dados</text>
  </g>

  <!-- 6. DECISÃO 2: Chamados >= 8? -->
  <g class="flow-node">
    <polygon points="430,662 530,730 430,798 330,730" fill="var(--decision-bg)" stroke="var(--decision-stroke)" stroke-width="2" filter="url(#shadow-sm)"/>
    <text x="430" y="718" text-anchor="middle" font-size="10" font-weight="600" fill="var(--decision-text)" font-family="Inter, system-ui">Chamados</text>
    <text x="430" y="733" text-anchor="middle" font-size="10" font-weight="600" fill="var(--decision-text)" font-family="Inter, system-ui">abertos ≥ 8?</text>
  </g>

  <!-- 7a. ALERTA VISUAL CRÍTICO (right side) -->
  <g class="flow-node">
    <rect x="570" y="822" width="140" height="86" rx="10" fill="var(--alert-bg)" stroke="var(--alert-stroke)" stroke-width="2.5" filter="url(#shadow-alert)"/>
    <text x="640" y="854" text-anchor="middle" font-size="18" fill="var(--text-on-dark)" font-family="Inter, system-ui">🚨</text>
    <text x="640" y="874" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--text-on-dark)" font-family="Inter, system-ui" letter-spacing="0.02em">ALERTA CRÍTICO</text>
    <text x="640" y="890" text-anchor="middle" font-size="9.5" font-weight="500" fill="oklch(85% 0.04 25)" font-family="Inter, system-ui">Exibe alerta na tela</text>
    <!-- Pulsing ring -->
    <rect x="566" y="818" width="148" height="94" rx="13" fill="none" stroke="oklch(55% 0.2 25)" stroke-width="1.5" opacity="0.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 7b. LISTA NA TELA (left side) -->
  <g class="flow-node">
    <rect x="150" y="822" width="140" height="86" rx="10" fill="var(--success-bg)" stroke="var(--success-stroke)" stroke-width="2" filter="url(#shadow-sm)"/>
    <text x="220" y="854" text-anchor="middle" font-size="18" fill="var(--success-text)" font-family="Inter, system-ui">✅</text>
    <text x="220" y="874" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--success-text)" font-family="Inter, system-ui" letter-spacing="0.02em">CHAMADO LISTADO</text>
    <text x="220" y="890" text-anchor="middle" font-size="9.5" font-weight="500" fill="var(--success-text)" font-family="Inter, system-ui">Exibe na tela</text>
  </g>

  <!-- 8. FIM -->
  <g class="flow-node">
    <rect x="355" y="1032" width="150" height="46" rx="23" fill="var(--end-bg)" filter="url(#shadow-sm)"/>
    <text x="430" y="1060" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text-on-dark)" font-family="Inter, system-ui" letter-spacing="0.04em">FIM</text>
  </g>

  <!-- ========== STEP NUMBERS ========== -->
  <g class="flow-arrow" font-family="Inter, system-ui">
    <circle cx="290" cy="24" r="12" fill="var(--start-bg)" opacity="0.15"/>
    <text x="290" y="28" text-anchor="middle" font-size="10" font-weight="700" fill="var(--start-bg)">1</text>

    <circle cx="290" cy="110" r="12" fill="var(--input-header)" opacity="0.15"/>
    <text x="290" y="114" text-anchor="middle" font-size="10" font-weight="700" fill="var(--input-header)">2</text>

    <circle cx="328" cy="310" r="12" fill="var(--decision-stroke)" opacity="0.15"/>
    <text x="328" y="314" text-anchor="middle" font-size="10" font-weight="700" fill="var(--decision-stroke)">3</text>

    <circle cx="140" cy="428" r="12" fill="var(--error-stroke)" opacity="0.15"/>
    <text x="140" y="432" text-anchor="middle" font-size="10" font-weight="700" fill="var(--error-stroke)">4</text>

    <circle cx="290" cy="470" r="12" fill="var(--process-header)" opacity="0.15"/>
    <text x="290" y="474" text-anchor="middle" font-size="10" font-weight="700" fill="var(--process-header)">5</text>

    <circle cx="320" cy="670" r="12" fill="var(--decision-stroke)" opacity="0.15"/>
    <text x="320" y="674" text-anchor="middle" font-size="10" font-weight="700" fill="var(--decision-stroke)">6</text>

    <circle cx="560" cy="830" r="12" fill="var(--alert-stroke)" opacity="0.15"/>
    <text x="560" y="834" text-anchor="middle" font-size="10" font-weight="700" fill="var(--alert-stroke)">7a</text>

    <circle cx="140" cy="830" r="12" fill="var(--success-stroke)" opacity="0.15"/>
    <text x="140" y="834" text-anchor="middle" font-size="10" font-weight="700" fill="var(--success-stroke)">7b</text>

    <circle cx="345" cy="1040" r="12" fill="var(--end-stroke)" opacity="0.15"/>
    <text x="345" y="1044" text-anchor="middle" font-size="10" font-weight="700" fill="var(--end-stroke)">8</text>
  </g>
</svg>
</div>

<div class="legend">
  <div class="legend-item">
    <div class="legend-swatch" style="background: var(--start-bg); border-radius: 8px;"></div>
    Início / Fim
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: var(--input-bg); border: 2px solid var(--input-stroke);"></div>
    Entrada de Dados
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: var(--decision-bg); border: 2px solid var(--decision-stroke); transform: rotate(45deg); width: 16px; height: 16px;"></div>
    Decisão
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: var(--process-bg); border: 2px solid var(--process-stroke);"></div>
    Processamento
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: var(--error-bg); border: 2px solid var(--error-stroke);"></div>
    Erro / Alerta
  </div>
  <div class="legend-item">
    <div class="legend-swatch" style="background: var(--success-bg); border: 2px solid var(--success-stroke);"></div>
    Sucesso
  </div>
</div>

</body>
</html>
